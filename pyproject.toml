[project]
name = "embylog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Opal Symes", email = "code@opal.codes" }
]
requires-python = ">=3.15"
dependencies = [
    "colorama>=0.4.6",
    "machofile>=2026.2.10",
    "macholib>=1.16.4",
    "pyelftools>=0.33",
    "watchfiles>=1.3.0",
]

[project.scripts]
embylog = "embylog:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cformat>=20.1.0",
    "black>=26.10.1",
    "isort>=9.0.2",
]
